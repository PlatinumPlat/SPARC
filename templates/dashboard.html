<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARC</title>
    <link rel="stylesheet" href="../static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <i class="fa-solid fa-heart-pulse"></i>
                <span>SPARC</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="guide.html">Guide</a></li>
                <li><a href="info.html">Info</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="faq.html">FAQ</a></li>
            </ul>
        </nav>
    </header>
    <div class="dashboard-container">
        <aside class="logs-panel">
            <h2>Session Logs</h2>
            <br><br>
            <div class="current-session" id ="current-session">
                <strong>New Session</strong>
            </div>
            <div class="log-list" id="log-list">
            </div>
        </aside>
        <main class="session-panel">
            <h2 id="session-date"></h2>
            <div class="top-section">
                <div class="upload-box upload-btn">
                    <label for="imageInput">
                        Click to Upload Image
                    </label>
                    <div class="preview-container" id="preview-container">
                        <img id="preview" alt="Preview" src="">
                    </div>
                    <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        hidden>
                </div>
                <div class="results-box">
                    <label>Results</label>
                    <img id="result-image" src="" alt="Results">
                    <a id="download-btn" download class="download-btn">
                        <i class="fa-solid fa-download"></i>
                    </a>
                </div>
            </div>
            <div class="sample-images">
                <p class="sample-txt">Sample Images</p>
                    <img src="{{ url_for('static', filename='test5.jpg') }}" class="sample-img">
                    <img src="{{ url_for('static', filename='test15.jpg') }}" class="sample-img">
                    <img src="{{ url_for('static', filename='test16.jpg') }}" class="sample-img">
                    <img src="{{ url_for('static', filename='test21.jpg') }}" class="sample-img">
                    <img src="{{ url_for('static', filename='test25.jpg') }}" class="sample-img">
                    <img src="{{ url_for('static', filename='test26.jpg') }}" class="sample-img">
                    <img src="{{ url_for('static', filename='none.png') }}" class="rmv" id="rmv">
            </div>
            <br>
            <br>
            <div class="results-container">
                <div class="results-textbox">
                    <strong>Results</strong><br>
                    <p>
                        
                    </p>
                </div>
                <div class="data-box">
                    <strong>Data</strong><br>
                    <p>
                
                    </p>
                </div>
            </div>
            <button id="save-session-btn">
                Save these Results
            </button>
        </main>
    </div>
    <footer>
        <div class="footer-container">
            <div class="footer-logo">
                <i class="fa-solid fa-heart-pulse"></i>
                <span>SPARC</span>
            </div>
            <div class="footer-links">
                <div>
                    <h4>Main Pages</h4>
                    <a href="index.html">Home</a>
                    <a href="dashboard.html">Dashboard</a>
                    <a href="faq.html">FAQ</a>
                </div>
    
                <div>
                    <h4>Inner Pages</h4>
                    <a href="guide.html">Guide</a>
                    <a href="info.html">Info</a>
                    <a href="about.html">About</a>
                </div>
            </div>
        </div>
        <hr>
        <p class="creator">
            Created by Sophia Pu
        </p>
    </footer>
    <script src="../static/dashboard.js"></script>
</body>
</html>
